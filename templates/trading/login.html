<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockGame Super Admin - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .glass-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
        .form-input { background: #0d1117; border: 1px solid #30363d; color: #f0f6fc; border-radius: 8px; padding: 10px 12px; font-size: 14px; width: 100%; }
        .form-input:focus { outline: none; border-color: #10b981; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="glass-card p-8 w-full max-w-md shadow-2xl">
        <div class="flex items-center gap-3 mb-6">
            <div class="w-10 h-10 rounded-lg bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center">
                <i class="fa-solid fa-shield-halved text-emerald-400 text-lg"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">StockGame Super Admin</h1>
                <p class="text-xs text-gray-400">Multi-Account Algorithmic Trading Control</p>
            </div>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" action="{% url 'trading:login' %}" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div>
                <label class="block text-xs text-gray-400 mb-1.5">Username</label>
                <input type="text" name="username" required autofocus class="form-input" placeholder="admin">
            </div>
            <div>
                <label class="block text-xs text-gray-400 mb-1.5">Password</label>
                <input type="password" name="password" required class="form-input" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm rounded-lg transition-colors">
                <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Sign In to Super Admin
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-gray-800 text-center">
            <a href="/admin/" class="text-xs text-gray-400 hover:text-cyan-400">
                Or open Django Admin (/admin/)
            </a>
        </div>
    </div>
</body>
</html>
